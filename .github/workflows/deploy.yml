name: Manual MarocVows cPanel fallback deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to MarocVows cPanel fallback hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: server315.web-hosting.com
          username: deploy@marocvows.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            README.md
            LAUNCH_CHECKLIST.md
            CNAME
            .nojekyll

# Production traffic should use the canonical public host.
# This workflow is retained only as a manual fallback to avoid dual automatic deployments.
