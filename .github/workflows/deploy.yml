name: Deploy MarocVows to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to MarocVows hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: server315.web-hosting.com
          username: deploy@marocvows.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            README.md
            LAUNCH_CHECKLIST.md
            CNAME
            .nojekyll

# Deployment connection verified; pushes to main publish the static site.
