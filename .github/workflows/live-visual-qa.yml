name: Live Visual QA

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-visual-qa:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.workflow_run.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.57.0
          npx playwright install --with-deps chromium

      - name: Run live production QA
        run: |
          mkdir -p qa-artifacts
          npx playwright test tests/live-qa.spec.js --reporter=list
        env:
          CI: 'true'

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marocvows-live-qa-screenshots
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
