name: Live Visual QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  production-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for this commit to deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          success=0
          for attempt in $(seq 1 60); do
            json=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/commits/${SHA}/check-runs")
            status=$(printf '%s' "$json" | jq -r '[.check_runs[] | select(.name=="deploy")][0].status // "missing"')
            conclusion=$(printf '%s' "$json" | jq -r '[.check_runs[] | select(.name=="deploy")][0].conclusion // ""')
            echo "Pages deploy check: ${status} ${conclusion} (attempt ${attempt}/60)"
            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
              success=1
              break
            fi
            if [ "$status" = "completed" ] && [ -n "$conclusion" ] && [ "$conclusion" != "success" ]; then
              echo "Pages deployment failed: ${conclusion}"
              exit 1
            fi
            sleep 5
          done
          if [ "$success" -ne 1 ]; then
            echo "Timed out waiting for GitHub Pages deployment."
            exit 1
          fi
          sleep 10

      - name: Diagnose production routes
        run: |
          for path in / /index.html /plan.html /wedding-caterers-fes.html; do
            echo "===== ${path} ====="
            curl -sSIL --max-time 20 \
              -o "/tmp/headers-$(echo "$path" | tr '/.' '__')" \
              -w 'effective=%{url_effective} status=%{http_code} connect=%{time_connect} start=%{time_starttransfer} total=%{time_total}\n' \
              "https://www.marocvows.com${path}" || echo "curl_failed=$?"
            cat "/tmp/headers-$(echo "$path" | tr '/.' '__')" 2>/dev/null || true
            echo
          done

          echo '===== root GET first bytes ====='
          curl -sS --max-time 20 -D /tmp/root-get-headers \
            -o /tmp/root-get-body \
            -w 'status=%{http_code} bytes=%{size_download} total=%{time_total}\n' \
            https://www.marocvows.com/ || echo "root_get_failed=$?"
          cat /tmp/root-get-headers 2>/dev/null || true
          wc -c /tmp/root-get-body 2>/dev/null || true
          head -c 300 /tmp/root-get-body 2>/dev/null || true
          echo

          echo '===== index GET first bytes ====='
          curl -sS --max-time 20 -D /tmp/index-get-headers \
            -o /tmp/index-get-body \
            -w 'status=%{http_code} bytes=%{size_download} total=%{time_total}\n' \
            https://www.marocvows.com/index.html || echo "index_get_failed=$?"
          cat /tmp/index-get-headers 2>/dev/null || true
          wc -c /tmp/index-get-body 2>/dev/null || true
          head -c 300 /tmp/index-get-body 2>/dev/null || true
          echo

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.57.0
          npx playwright install --with-deps chromium

      - name: Run live production QA
        run: |
          mkdir -p qa-artifacts
          npx playwright test tests/live-qa.spec.js --reporter=list
        env:
          CI: 'true'

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marocvows-live-qa-screenshots
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
