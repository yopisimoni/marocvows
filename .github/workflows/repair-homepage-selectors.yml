name: Repair Homepage Selectors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-homepage-selectors.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair multi-element selectors
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('app.js')
          source = path.read_text()
          selectors = [
              "[data-share]",
              "[data-clear-filters]",
              "[data-quick-oauth-provider]",
          ]

          changed = source
          for selector in selectors:
              pattern = re.escape("$('" + selector + "').forEach")
              changed = re.sub(r'(?<!\$)' + pattern, "$$('" + selector + "').forEach", changed)

          leftovers = [selector for selector in selectors if re.search(r'(?<!\$)' + re.escape("$('" + selector + "').forEach"), changed)]
          if leftovers:
              raise SystemExit(f'Homepage selector repair incomplete: {leftovers}')

          if changed == source:
              print('Selectors already repaired; nothing to commit.')
          else:
              path.write_text(changed)
              print('Repaired homepage multi-element selectors.')
          PY

      - name: Validate JavaScript
        run: node --check app.js

      - name: Commit repair
        run: |
          if git diff --quiet -- app.js; then
            echo 'No app.js change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Fix homepage multi-element selectors'
          git push origin HEAD:main
